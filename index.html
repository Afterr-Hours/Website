function render(r){

 const md=$("meta[name=description]");md&&md.setAttribute("content",ok?D[r]:"This page does not exist on AFTER HOURS.");
 document.body.dataset.p=ok?r:"404";
 $("#nav").innerHTML=NAV.map(n=>`<a class="l ${n[0]==r?"on":""}" href="#${n[0]}"${n[0]==r?' aria-current="page"':""}>${n[1]}</a>`).join("")+`<a class="btn s" href="#contact">RESERVE YOUR EXPERIENCE</a>`;
 menu(false);scrollTo({top:0,behavior:"instant"});m.focus({preventScroll:true});
 if(r=="gallery")gal("All");if(r=="contact")form();obs();
}

function lb(k){
 if(!list.length)return;if(!$("#lb").classList.contains("on"))last=document.activeElement;

const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function form(){
 const f=$("#fm");f.d.min=today();
 const V={n:v=>v.trim().length>1||"Please enter your name.",e:v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())||"Please enter a valid email address.",d:v=>!v||v>=today()||"Please choose today or a later date.",g:v=>!v||(Number.isInteger(+v)&&+v>=1&&+v<=99)||"Guests must be a whole number from 1 to 99.",m:v=>v.trim().length>=10||"Please add a short message (at least 10 characters)."};
 const chk=k=>{const el=f[k],r=V[k](el.value),er=$("#er-"+k);el.setAttribute("aria-invalid",r!==true);er.textContent=r===true?"":r;return r===true};
 Object.keys(V).forEach(k=>{f[k].addEventListener("blur",()=>chk(k));f[k].addEventListener("input",()=>{if(f[k].getAttribute("aria-invalid")=="true")chk(k)})});
 f.onsubmit=async e=>{
  e.preventDefault();const s=$("#fs");s.className="";
  const bad=Object.keys(V).filter(k=>!chk(k));
  if(bad.length){s.className="bad";s.textContent="Please correct the highlighted fields.";f[bad[0]].focus();return}
  if(!FORM_ENDPOINT){s.className="bad";s.textContent="Not sent. This website is not yet connected to an enquiry service, so nothing was submitted. Please try again once contact details are published.";return}
  const b=f.querySelector("button");b.disabled=true;s.textContent="Sending…";
  try{const r=await fetch(FORM_ENDPOINT,{method:"POST",body:new FormData(f),headers:{Accept:"application/json"}});if(!r.ok)throw 0;f.reset();s.className="ok";s.textContent="Thank you. Your enquiry has been sent. This is not a confirmed reservation; we will reply to you directly."}
  catch(_){s.className="bad";s.textContent="Something went wrong and your enquiry was not sent. Please try again shortly."}
  b.disabled=false};
}
